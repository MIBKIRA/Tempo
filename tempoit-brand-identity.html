<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Tempoit — Brand Mark</title>
<style>
  /* ============================================================
     TOKENS
     ============================================================ */
  :root {
    --bg: #08090b;
    --card-border: rgba(255, 255, 255, 0.09);
    --ink: #f5f6f7;
    --ink-dim: rgba(245, 246, 247, 0.58);
    --ink-faint: rgba(245, 246, 247, 0.34);
    --accent: #5468ff;
    --accent-soft: rgba(84, 104, 255, 0.4);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
    --ease-snap: cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
  }

  body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(ellipse 900px 480px at 50% -8%, rgba(84, 104, 255, 0.10), transparent 62%),
      var(--bg);
  }

  .page {
    max-width: 1080px;
    margin: 0 auto;
    padding: 96px 32px 64px;
  }

  .page-header {
    text-align: center;
    margin-bottom: 72px;
  }

  .eyebrow {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 14px;
  }

  .tagline {
    font-size: 16px;
    line-height: 1.5;
    color: var(--ink-dim);
    font-weight: 400;
    margin: 0;
  }

  main {
    display: grid;
    grid-template-columns: 0.82fr 1.3fr;
    gap: 24px;
    align-items: stretch;
  }

  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; }
    .page { padding: 56px 20px 48px; }
    .page-header { margin-bottom: 56px; }
  }

  .card {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.012));
    border: 1px solid var(--card-border);
    border-radius: 24px;
    padding: 44px 30px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .card-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 36px;
  }

  .stage {
    position: relative;
    width: 100%;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 160px;
    border-radius: 16px;
    background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.035), transparent 72%);
  }

  .mark-svg { overflow: visible; display: block; }

  #static-mark {
    width: min(170px, 42vw);
    height: auto;
    cursor: pointer;
  }

  #wordmark {
    width: 100%;
    max-width: 610px;
    height: auto;
    cursor: pointer;
  }

  .card-hint {
    font-size: 13px;
    color: var(--ink-faint);
    margin: 22px 0 0;
  }

  .replay-btn {
    margin-top: 26px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 22px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: transparent;
    color: var(--ink-dim);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: border-color 0.25s, background 0.25s, color 0.25s;
  }
  .replay-btn:hover {
    border-color: rgba(255, 255, 255, 0.32);
    background: rgba(255, 255, 255, 0.05);
    color: var(--ink);
  }
  .replay-btn svg {
    width: 14px;
    height: 14px;
  }

  #wordmark:focus-visible,
  #static-mark:focus-visible,
  .replay-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
    border-radius: 8px;
  }

  .page-footer {
    text-align: center;
    margin-top: 72px;
    font-size: 12px;
    color: var(--ink-faint);
  }

  /* ============================================================
     MARK — shared geometry styling
     ============================================================ */
  .bar-path {
    fill: none;
    stroke: var(--ink);
    stroke-width: 18;
    stroke-linecap: round;
    transition: d 0.4s var(--ease-in-out), stroke 0.35s ease, filter 0.35s ease;
  }

  .stem-shape,
  .projectile-shape {
    fill: var(--ink);
  }

  .letter-stroke {
    fill: none;
    stroke: var(--ink);
    stroke-width: 22;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .dot-shape { fill: var(--ink); }

  .reveal-el {
    opacity: 0;
    transform: translateY(12px) scale(0.95);
  }
  .final-i-stem { opacity: 0; }
  .i-dot { opacity: 0; }
  .projectile-shape { opacity: 1; }

  /* Hover + tap micro-interaction: a tiny echo of the full draw */
  #static-mark:hover .bar-path,
  #static-mark.tap-pulse .bar-path,
  #wordmark.intro-done:hover .bar-path {
    d: path("M20,44 Q96,58 172,44");
  }
  #static-mark:hover,
  #static-mark.tap-pulse,
  #wordmark.intro-done:hover {
    transform: scale(1.015);
    transition: transform 0.3s var(--ease-out);
  }

  /* ============================================================
     KEYFRAMES — the story

     Bow tension: draw is slow (effort), release is fast (snap) —
     that asymmetry is what makes it read as archery instead of
     just "a line moving." No held pause; the asymmetric timing
     itself carries the anticipation, which keeps the motion fluid.

     Arrow flight: the shape starts vertical (tip down, as the T's
     stem) and rotates hard toward horizontal at the midpoint of
     flight so the tapered tip visibly LEADS the direction of
     travel like a real loosed arrow, then eases back upright as
     it decelerates into landing — so it settles cleanly into the
     vertical line it's about to become (the i).
     ============================================================ */
  @keyframes barTension {
    0%   { d: path("M20,44 Q96,41 172,44"); stroke: var(--ink); filter: none; }
    18%  { d: path("M20,44 Q96,41 172,44"); stroke: var(--ink); filter: none; }
    50%  { d: path("M20,44 Q96,95 172,44"); stroke: var(--accent); filter: drop-shadow(0 0 11px var(--accent-soft)); }
    64%  { d: path("M20,44 Q96,18 172,44"); stroke: var(--accent); filter: drop-shadow(0 0 7px var(--accent-soft)); }
    82%  { d: path("M20,44 Q96,45 172,44"); stroke: var(--ink); filter: none; }
    100% { d: path("M20,44 Q96,41 172,44"); stroke: var(--ink); filter: none; }
  }

  @keyframes arrowFlight {
    0%   { transform: translate(0,0) rotate(0deg) scale(1,1); fill: var(--ink); opacity: 1; }
    10%  { transform: translate(0,0) rotate(0deg) scale(1,1); fill: var(--ink); opacity: 1; }
    45%  { transform: translate(249px,-72px) rotate(-85deg) scale(0.94,0.9); fill: var(--accent); opacity: 1; }
    78%  { transform: translate(513px,14px) rotate(-40deg) scale(0.85,0.81); fill: var(--accent); opacity: 1; }
    100% { transform: translate(599px,0) rotate(0deg) scale(0.82,0.79); fill: var(--accent); opacity: 0; }
  }

  @keyframes stemSettle {
    0%   { opacity: 0; transform: scaleY(0.8); }
    100% { opacity: 1; transform: scaleY(1); }
  }

  @keyframes dotDrop {
    0%   { opacity: 0; transform: translateY(-16px) scale(0.5); fill: var(--accent); }
    55%  { fill: var(--accent); }
    100% { opacity: 1; transform: translateY(0) scale(1); fill: var(--ink); }
  }

  @keyframes revealUp {
    0%   { opacity: 0; transform: translateY(12px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .wordmark.playing .bar-path {
    animation: barTension 1.05s var(--ease-in-out) 0.2s both;
  }
  .wordmark.playing .projectile-shape {
    animation: arrowFlight 0.62s var(--ease-out) 0.87s both;
    transform-origin: 96px 116px;
    will-change: transform, opacity;
  }
  .wordmark.playing .final-i-stem {
    animation: stemSettle 0.28s var(--ease-snap) 1.37s both;
    transform-origin: 695px 169px;
  }
  .wordmark.playing .i-dot {
    animation: dotDrop 0.3s var(--ease-snap) 1.6s both;
  }
  .wordmark.playing .e-letter {
    animation: revealUp 0.4s var(--ease-out) 1.95s both;
    transform-origin: 248px 130px;
  }
  .wordmark.playing .m-letter {
    animation: revealUp 0.4s var(--ease-out) 2.04s both;
    transform-origin: 372px 125px;
  }
  .wordmark.playing .p-letter {
    animation: revealUp 0.4s var(--ease-out) 2.13s both;
    transform-origin: 497px 130px;
  }
  .wordmark.playing .o-letter {
    animation: revealUp 0.4s var(--ease-out) 2.22s both;
    transform-origin: 614px 130px;
  }
  .wordmark.playing .final-t {
    animation: revealUp 0.35s var(--ease-out) 2.68s both;
    transform-origin: 768px 110px;
  }

  .wordmark.intro-done .reveal-el,
  .wordmark.intro-done .final-i-stem,
  .wordmark.intro-done .i-dot {
    opacity: 1;
    transform: none;
  }
  .wordmark.intro-done .projectile-shape {
    opacity: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .wordmark.playing .bar-path,
    .wordmark.playing .projectile-shape,
    .wordmark.playing .final-i-stem,
    .wordmark.playing .i-dot,
    .wordmark.playing .e-letter,
    .wordmark.playing .m-letter,
    .wordmark.playing .p-letter,
    .wordmark.playing .o-letter,
    .wordmark.playing .final-t {
      animation-duration: 0.01ms !important;
      animation-delay: 0s !important;
    }
    #static-mark:hover .bar-path,
    #wordmark.intro-done:hover .bar-path {
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

  <div class="page">
    <header class="page-header">
      <span class="eyebrow">Tempoit</span>
      <p class="tagline">From intention to execution.</p>
    </header>

    <main>
      <section class="card" id="static-preview">
        <h2 class="card-label">Static Mark</h2>
        <div class="stage">
          <svg id="static-mark" class="mark-svg" viewBox="0 0 200 210"
               xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tempoit mark"
               tabindex="0">
            <path id="static-bowstring" class="bar-path"
                  d="M20,44 Q96,41 172,44"/>
            <path id="static-arrow-stem" class="stem-shape"
                  d="M83,55 C84,97 88,147 91,177 Q96,184 101,177 C104,147 108,97 109,55 Z"/>
          </svg>
        </div>
        <p class="card-hint">Hover to feel the tension</p>
      </section>

      <section class="card" id="animated-preview">
        <h2 class="card-label">Motion Story</h2>
        <div class="stage">
          <svg id="wordmark" class="mark-svg wordmark" viewBox="-10 -30 840 260"
               xmlns="http://www.w3.org/2000/svg" role="button"
               aria-label="Replay the Tempoit logo animation" tabindex="0">

            <g id="t-icon">
              <path id="wordmark-bowstring" class="bar-path"
                    d="M20,44 Q96,41 172,44"/>
              <path id="wordmark-arrow-stem" class="stem-shape"
                    d="M83,55 C84,97 88,147 91,177 Q96,184 101,177 C104,147 108,97 109,55 Z"/>
              <path id="wordmark-projectile" class="projectile-shape"
                    d="M83,55 C84,97 88,147 91,177 Q96,184 101,177 C104,147 108,97 109,55 Z"/>
            </g>

            <g id="letter-e" class="reveal-el e-letter">
              <path class="letter-stroke"
                    d="M285,142 A39,39 0 0,1 248,169 A39,39 0 0,1 209,130 A39,39 0 0,1 248,91 A39,39 0 0,1 285,118"/>
              <path class="letter-stroke" d="M209,130 L284,130"/>
            </g>

            <g id="letter-m" class="reveal-el m-letter">
              <path class="letter-stroke"
                    d="M326,169 L326,100 C326,80 372,80 372,100 L372,169 L372,100 C372,80 418,80 418,100 L418,169"/>
            </g>

            <g id="letter-p" class="reveal-el p-letter">
              <path class="letter-stroke" d="M458,91 L458,209"/>
              <path class="letter-stroke" d="M536,130 A39,39 0 1,1 458,130 A39,39 0 1,1 536,130"/>
            </g>

            <g id="letter-o" class="reveal-el o-letter">
              <path class="letter-stroke" d="M653,130 A39,39 0 1,1 575,130 A39,39 0 1,1 653,130"/>
            </g>

            <path id="letter-i-stem" class="letter-stroke final-i-stem" d="M695,91 L695,169"/>
            <circle id="letter-i-dot" class="dot-shape i-dot" cx="695" cy="50" r="12"/>

            <g id="letter-t-final" class="reveal-el final-t">
              <path class="letter-stroke" d="M768,46 L768,160 C768,172 778,176 790,174"/>
              <path class="letter-stroke" d="M736,80 L798,80"/>
            </g>
          </svg>
        </div>
        <button id="replay-btn" class="replay-btn" type="button" aria-label="Replay animation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1 4 1 10 7 10"/>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
          </svg>
          Replay
        </button>
      </section>
    </main>

    <footer class="page-footer">
      <p>A single geometric gesture.</p>
    </footer>
  </div>

  <script>
    (function () {
      var wordmark = document.getElementById('wordmark');
      var replayBtn = document.getElementById('replay-btn');
      var staticMark = document.getElementById('static-mark');
      var INTRO_MS = 3100;
      var timer = null;

      function playIntro() {
        wordmark.classList.remove('intro-done', 'playing');
        wordmark.getBoundingClientRect(); // force reflow so the animation restarts
        wordmark.classList.add('playing');
        clearTimeout(timer);
        timer = setTimeout(function () {
          wordmark.classList.remove('playing');
          wordmark.classList.add('intro-done');
        }, INTRO_MS);
      }

      replayBtn.addEventListener('click', playIntro);
      wordmark.addEventListener('click', playIntro);
      wordmark.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          playIntro();
        }
      });

      // Touch devices can't hover — tapping the static mark gives the same
      // brief string-tension feedback that a cursor hover would.
      function tapPulse() {
        staticMark.classList.remove('tap-pulse');
        staticMark.getBoundingClientRect();
        staticMark.classList.add('tap-pulse');
        setTimeout(function () { staticMark.classList.remove('tap-pulse'); }, 450);
      }
      staticMark.addEventListener('click', tapPulse);
      staticMark.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          tapPulse();
        }
      });

      setTimeout(playIntro, 300);
    })();
  </script>

</body>
</html>
